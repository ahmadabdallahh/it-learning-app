<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انشاء حساب - IT Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #F7F7FF;
            color: #111827;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div
        class="max-w-md w-full bg-white p-8 rounded-2xl border border-[#E5E7EB] shadow-[0_4px_20px_rgba(80,70,229,0.04)]">
        <div class="text-center mb-8">
            <div
                class="inline-flex bg-[#5046E5] text-white w-12 h-12 rounded-2xl font-bold text-xl items-center justify-center shadow-md mb-3">
                IT</div>
            <h1 class="text-2xl font-bold">انضم لدفعتك الآن</h1>
            <p class="text-xs text-[#6B7280] mt-1">أنشئ حساباً جديداً للوصول الكامل لكل المواد</p>
        </div>

        <form action="verify-otp.html" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold mb-1.5 text-[#111827]">الاسم الكامل</label>
                <input type="text"
                    class="w-full px-4 py-3 rounded-xl border border-[#E5E7EB] text-sm focus:outline-none focus:border-[#5046E5] bg-[#F7F7FF]/50"
                    placeholder="أحمد محمد">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1.5 text-[#111827]">البريد الإلكتروني</label>
                <input type="email"
                    class="w-full px-4 py-3 rounded-xl border border-[#E5E7EB] text-sm focus:outline-none focus:border-[#5046E5] bg-[#F7F7FF]/50"
                    placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-1.5 text-[#111827]">كلمة المرور</label>
                <input type="password"
                    class="w-full px-4 py-3 rounded-xl border border-[#E5E7EB] text-sm focus:outline-none focus:border-[#5046E5] bg-[#F7F7FF]/50"
                    placeholder="••••••••">
            </div>
            <button type="submit"
                class="w-full bg-[#5046E5] hover:bg-[#4338CA] text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-md shadow-[#5046E5]/20 mt-2">
                متابعة وإنشاء الحساب
            </button>
        </form>

        <p class="text-center text-xs text-[#6B7280] mt-6">
            لديك حساب بالفعل؟ <a href="login.html" class="text-[#5046E5] font-bold hover:underline">سجل دخولك</a>
        </p>
    </div>

</body>

</html>
