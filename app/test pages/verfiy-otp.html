<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الكود - IT Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #F7F7FF;
            color: #111827;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div
        class="max-w-md w-full bg-white p-8 rounded-2xl border border-[#E5E7EB] shadow-[0_4px_20px_rgba(80,70,229,0.04)] text-center">
        <div
            class="inline-flex bg-[#EEF0FF] text-[#5046E5] w-12 h-12 rounded-2xl font-bold text-xl items-center justify-center mb-3">
            🔒</div>
        <h1 class="text-2xl font-bold mb-1">أدخل كود التحقق</h1>
        <p class="text-xs text-[#6B7280] mb-8">تم إرسال كود مكون من 4 أرقام إلى بريدك الإلكتروني</p>

        <form class="space-y-6">
            <div class="flex justify-center gap-3" dir="ltr">
                <input type="text" maxlength="1"
                    class="w-14 h-14 text-center text-xl font-bold rounded-xl border border-[#E5E7EB] focus:outline-none focus:border-[#5046E5] bg-[#F7F7FF]/50">
                <input type="text" maxlength="1"
                    class="w-14 h-14 text-center text-xl font-bold rounded-xl border border-[#E5E7EB] focus:outline-none focus:border-[#5046E5] bg-[#F7F7FF]/50">
                <input type="text" maxlength="1"
                    class="w-14 h-14 text-center text-xl font-bold rounded-xl border border-[#E5E7EB] focus:outline-none focus:border-[#5046E5] bg-[#F7F7FF]/50">
                <input type="text" maxlength="1"
                    class="w-14 h-14 text-center text-xl font-bold rounded-xl border border-[#E5E7EB] focus:outline-none focus:border-[#5046E5] bg-[#F7F7FF]/50">
            </div>

            <button type="submit"
                class="w-full bg-[#5046E5] hover:bg-[#4338CA] text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-md shadow-[#5046E5]/20">
                تحقق وتفعيل الحساب
            </button>
        </form>

        <p class="text-xs text-[#6B7280] mt-6">
            لم تستلم الكود؟ <a href="#" class="text-[#5046E5] font-bold hover:underline">إعادة إرسال</a>
        </p>
    </div>

</body>

</html>
