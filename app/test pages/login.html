<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - IT Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #F7F7FF;
            color: #111827;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div
        class="max-w-md w-full bg-white p-8 rounded-2xl border border-[#E5E7EB] shadow-[0_4px_20px_rgba(80,70,229,0.04)]">
        <div class="text-center mb-8">
            <div
                class="inline-flex bg-[#5046E5] text-white w-12 h-12 rounded-2xl font-bold text-xl items-center justify-center shadow-md mb-3">
                IT</div>
            <h1 class="text-2xl font-bold">مرحباً بك مجدداً</h1>
            <p class="text-xs text-[#6B7280] mt-1">سجل الدخول للمتابعة إلى منصة المذاكرة</p>
        </div>

        <form class="space-y-4">
            <div>
                <label class="block text-xs font-semibold mb-1.5 text-[#111827]">البريد الإلكتروني أو كود الدفعة</label>
                <input type="text"
                    class="w-full px-4 py-3 rounded-xl border border-[#E5E7EB] text-sm focus:outline-none focus:border-[#5046E5] bg-[#F7F7FF]/50"
                    placeholder="name@example.com">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-semibold text-[#111827]">كلمة المرور</label>
                    <a href="forgot-password.html" class="text-xs text-[#5046E5] hover:underline">نسيت كلمة المرور؟</a>
                </div>
                <input type="password"
                    class="w-full px-4 py-3 rounded-xl border border-[#E5E7EB] text-sm focus:outline-none focus:border-[#5046E5] bg-[#F7F7FF]/50"
                    placeholder="••••••••">
            </div>
            <button type="submit"
                class="w-full bg-[#5046E5] hover:bg-[#4338CA] text-white font-semibold py-3 rounded-xl text-sm transition-all shadow-md shadow-[#5046E5]/20 mt-2">
                تسجيل الدخول
            </button>
        </form>

        <p class="text-center text-xs text-[#6B7280] mt-6">
            ليس لديك حساب؟ <a href="register.html" class="text-[#5046E5] font-bold hover:underline">انشئ حساباً الآن</a>
        </p>
    </div>

</body>

</html>
